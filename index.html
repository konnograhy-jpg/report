<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報告書總覽 | 給老闆看的報告書 HTML 專用</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #2b579a;
            --primary-dark: #1a3a6b;
            --primary-light: #e8f1f5;
            --accent: #f0a500;
            --bg: #0f1923;
            --surface: #1a2535;
            --surface2: #202f45;
            --text: #e8edf5;
            --text-muted: #8a9ab5;
            --border: rgba(255,255,255,0.07);
            --success: #27ae60;
            --glow: rgba(43, 87, 154, 0.4);
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(43,87,154,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(43,87,154,0.10) 0%, transparent 60%);
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease;
        }

        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), #4a7fd4);
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .header h1 span {
            background: linear-gradient(135deg, #4a9fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), #4a7fd4);
            border-radius: 2px;
            margin: 20px auto;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease 0.2s both;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 900;
            color: #4a9fff;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Section title */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Report cards */
        .report-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        .report-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .report-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(43,87,154,0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .report-card:hover {
            border-color: rgba(74, 159, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(43,87,154,0.25), 0 0 0 1px rgba(74,159,255,0.2);
        }

        .report-card:hover::before {
            opacity: 1;
        }

        .report-card:hover .card-arrow {
            transform: translateX(4px);
            color: #4a9fff;
        }

        .card-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            box-shadow: 0 4px 16px var(--glow);
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-category {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #4a9fff;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .meta-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(43,87,154,0.25);
            color: #7ab3ff;
            border: 1px solid rgba(43,87,154,0.3);
        }

        .card-arrow {
            font-size: 20px;
            color: var(--text-muted);
            transition: all 0.3s;
            flex-shrink: 0;
        }

        /* Empty state */
        .empty-hint {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.8;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .report-card { padding: 18px 20px; gap: 16px; }
            .card-icon { width: 44px; height: 44px; font-size: 20px; }
            .stats-bar { gap: 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="header-badge">📁 Report Hub</div>
        <h1>給老闆看的<span>報告書</span>專區</h1>
        <div class="divider"></div>
        <p>點選下方任一報告書，即可開啟完整內容</p>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-number" id="report-count">1</div>
            <div class="stat-label">份報告書</div>
        </div>
        <div class="stat-item">
            <div class="stat-number">🟢</div>
            <div class="stat-label">持續更新中</div>
        </div>
    </div>

    <!-- Report List -->
    <div class="section-title">所有報告書</div>
    <div class="report-grid" id="report-grid">

        <!-- 報告書 01：標案自動化收尋 -->
        <a href="標案自動化收尋.html" class="report-card" id="report-01">
            <div class="card-icon">💼</div>
            <div class="card-body">
                <div class="card-category">自動化系統</div>
                <div class="card-title">政府標案全自動化發報系統</div>
                <div class="card-desc">系統運作架構與流程報告書，涵蓋六大核心流程、色彩著色規範與效益分析。</div>
                <div class="card-meta">
                    <span class="meta-tag">📅 2026-05-20</span>
                    <span class="meta-tag">管理決策版</span>
                </div>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <!-- 未來的報告書會由賽巴斯自動新增在這裡 -->

    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 給老闆看的報告書 HTML 專用<br>
        由賽巴斯自動維護 · 每次新增報告書時自動更新此首頁
    </div>

</div>
</body>
</html>
