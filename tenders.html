<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日標案整理與公告專區</title>
    <meta name="description" content="自動化篩選與下午比對結果的每日公告歷史存檔專區。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0f1e;
            --surface: #111827;
            --surface2: #1a2236;
            --border: rgba(255,255,255,0.08);
            --blue: #3b82f6;
            --blue-dark: #1d4ed8;
            --blue-glow: rgba(59,130,246,0.3);
            --text: #f1f5f9;
            --muted: #64748b;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── 頂部導覽列 ── */
        .topbar {
            background: rgba(17,24,39,0.95);
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-dot {
            width: 10px; height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .topbar-count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ── Hero 區塊 ── */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px; left: 50%;
            transform: translateX(-50%);
            width: 600px; height: 400px;
            background: radial-gradient(ellipse, rgba(245,158,11,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: #fcd34d;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #f1f5f9 30%, #fcd34d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 14px;
            color: var(--muted);
            max-width: 520px;
            margin: 0 auto 10px;
            line-height: 1.7;
        }

        /* ── 主內容 ── */
        .main {
            flex: 1;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── 報告書卡片 ── */
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .report-card {
            display: block;
            text-decoration: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .report-card:hover {
            border-color: rgba(245,158,11,0.5);
            box-shadow: 0 0 0 1px rgba(245,158,11,0.2), 0 12px 40px rgba(0,0,0,0.3);
            transform: translateY(-3px);
        }

        .card-inner {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon-wrap {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .card-arrow-btn {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--muted);
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .report-card:hover .card-arrow-btn {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 16px rgba(245,158,11,0.3);
            border-color: transparent;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 28px 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            line-height: 2;
        }

        /* ── Animations ── */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease both;
        }

        .fade-up {
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
